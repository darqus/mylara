# Deploys the built SPA to GitHub Pages as a project site:
# https://darqus.github.io/mylara/
#
# The Pages publishing source must be "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source). When it is set to
# "Deploy from a branch", GitHub publishes the raw repository tree on every
# push and overwrites the artifact uploaded here.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  # `npm run update-env` commits and pushes the version bump
  contents: write
  # Deploy to GitHub Pages
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    # Never let a deployment hold the "pages" concurrency group forever
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Moscow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Configure git identity
        # `npm run update-env` creates a commit, which requires an author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Update environment
        run: npm run update-env

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Ensure Pages is built from GitHub Actions
        # The Pages publishing source is a repository setting. Switching it needs
        # the "Administration: write" permission, which the Actions GITHUB_TOKEN
        # cannot have, so this step is a no-op unless a personal access token
        # (fine-grained: Pages write + Administration write, or classic: repo)
        # is stored in the PAGES_ADMIN_TOKEN secret. Until then the setting has
        # to be changed once in Settings -> Pages -> Build and deployment.
        env:
          PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${PAGES_ADMIN_TOKEN}" ]; then
            echo "::notice title=Pages source::PAGES_ADMIN_TOKEN is not set, skipping the Pages source check"
            exit 0
          fi

          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${PAGES_ADMIN_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /repos/${GITHUB_REPOSITORY}/pages -> HTTP ${code}"

          if [ "$code" = '200' ] || [ "$code" = '204' ]; then
            echo "Pages publishing source is GitHub Actions"
            exit 0
          fi

          head -c 400 /tmp/pages.json || true
          echo "::error title=Pages source::could not switch the Pages publishing source (HTTP ${code})"
          exit 1

      - name: Build
        run: npm run build
        env:
          VITE_ROUTER_BASE: /
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 404.html, .nojekyll, robots.txt and sitemap.xml are copied from
          # `public/` by the build itself
          path: './dist/spa'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the published site
        # Guards against the failure mode we already hit: Pages publishing the
        # raw repository tree instead of this artifact, which leaves the site
        # pointing at a Quasar template with no scripts at all.
        run: |
          set -uo pipefail
          page_url='${{ steps.deployment.outputs.page_url }}'
          origin=$(printf '%s' "$page_url" | sed -E 's#^(https?://[^/]+).*#\1#')

          for attempt in 1 2 3 4 5 6; do
            html=$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' \
              "${page_url}?cachebust=${GITHUB_RUN_ID}-${attempt}" || true)
            asset=$(printf '%s' "$html" | grep -o '/mylara/assets/[^"]*\.js' | head -1 || true)

            if [ -n "$asset" ]; then
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${origin}${asset}")
              if [ "$status" = '200' ]; then
                echo "Published site is healthy: ${origin}${asset} -> 200"
                exit 0
              fi
            fi

            echo "attempt ${attempt}: ${page_url} does not serve the built bundle yet"
            sleep 15
          done

          echo "::warning title=Pages publishing source::${page_url} is still not serving the built SPA. The Pages source is most likely 'Deploy from a branch': set Settings -> Pages -> Build and deployment -> Source to 'GitHub Actions'."
